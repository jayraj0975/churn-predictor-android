plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jayraj.churnpredictor'
    compileSdk 36

    defaultConfig {
        applicationId "com.jayraj.churnpredictor"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    // Release signing comes from the environment, so no key or password is ever in the repository.
    // Without CHURN_KEYSTORE the release build is produced unsigned.
    def keystorePath = System.getenv('CHURN_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('CHURN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHURN_KEY_ALIAS') ?: 'churnpredictor'
                keyPassword System.getenv('CHURN_KEY_PASSWORD') ?: System.getenv('CHURN_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
